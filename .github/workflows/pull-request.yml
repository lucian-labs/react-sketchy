on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # node 14 cannot install the current devDependencies (vite 5 wants >= 18)
      - uses: actions/setup-node@v1
        with:
          node-version: 20.x

      - run: npm i
      - run: npm run lint
      - run: npm test -- --watchAll=false
        env:
          CI: true
