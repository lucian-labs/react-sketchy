on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # node 14 cannot install the current devDependencies (vite 5 wants >= 18)
      - uses: actions/setup-node@v2
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm i
      - run: npm run lint
      - run: npm test -- --watchAll=false
        env:
          CI: true

      # prepublishOnly re-runs lint and rebuilds lib/ + esm/ from scratch
      - run: npm run deploy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
