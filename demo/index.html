<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>react-sketchy — @dank-inc/react-sketchy</title>
    <meta
      name="description"
      content="Interactive demo of @dank-inc/react-sketchy — React bindings for sketchy: mount a sketch as a component, browse a set of them."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://ds.lucianlabs.ca/waveloop.css" />
    <script type="module" src="https://ds.lucianlabs.ca/waveloop.js"></script>
    <script>
      // @dank-inc/sketchy@0.26.x — what this package's `^0.26.3` range resolves
      // to, since a caret on a 0.x version never reaches sketchy's current 1.x —
      // does require('dotenv') and calls dotenv.config() at MODULE SCOPE in
      // lib/config.js. dotenv is Node-only and is not even declared among
      // sketchy's dependencies, so importing react-sketchy in a browser throws
      // "process is not defined" before a single component renders.
      //
      // This shim is the minimum that lets the module finish importing. dotenv's
      // own file read is already inside a try/catch, so it degrades to a no-op.
      // It has to run before the bundle, hence a blocking inline script.
      window.process = window.process || {
        env: {},
        cwd: function () {
          return '/'
        },
        platform: 'browser',
        version: '',
      }
    </script>
  </head>
  <body>
    <wl-demo
      sub="react-sketchy"
      wordmark="react sketchy"
      version="0.5.0"
      accent="violet"
      tagline="React bindings for sketchy. Mount a sketch as a component and let the effect own the canvas lifecycle, or hand SketchBrowser a set and page through them."
    >
      <div id="root"></div>
    </wl-demo>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
